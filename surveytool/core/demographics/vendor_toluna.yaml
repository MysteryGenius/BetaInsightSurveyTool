# Toluna vendor mapping.
#
# Verified against surveytool/ingest/toluna.py and the real fixture
# toluna_survey_misinformation_data.xlsx: demographic questions are the
# numbered columns 1-5 (qtype=single_choice; the ingest adapter assigns bare
# numeric qids for non-grid columns).
#
# age_band (column 2) IS mapped (Task 9). Independently re-extracted the raw
# column-2 values directly from toluna_survey_misinformation_data.xlsx (not
# trusting this comment's prior description) via openpyxl, counting distinct
# values across all 1000 rows:
#   "18-24 years old"          100
#   "25-34 years old"          221
#   "35-44 years old"          241
#   "45-54 years old"          224
#   "55 years old and above"   214
# Five distinct raw values, confirming the prior comment's description was
# accurate: there is no "Below 18" band, and the top band genuinely is one
# combined "55 years old and above" bucket -- the raw data itself never
# distinguishes a 55-64 respondent from a 65+ one, so there is no boundary to
# recover, invented or otherwise. under_18, 55_64 AND 65_plus are therefore
# all declared not_collected below (rather than splitting the top bucket at
# an arbitrary point), while the four bands that do map cleanly are mapped.
#
# IMPORTANT: unlike Rakuten, Toluna has no fixed vendor codebook — the
# ingest adapter (surveytool/ingest/toluna.py::_collect_single_values)
# assigns numeric codes purely by first-appearance order of each label
# within the loaded rows. Those numbers are an artifact of THIS fixture
# file's row order, not stable vendor codes: a re-export with a different
# first respondent (or reordered rows) would assign different numbers to
# the same labels. So value_map here keys on the normalized label text
# itself (via normalize_label(), see surveytool/core/hygiene.py) rather
# than the derived numeric code — the label text is what's actually stable
# across re-ingests of different files. demographic_registry.py's
# _raw_values_for_column() resolves each response's numeric raw_value back
# to its label (via the Question's ScaleCode.code -> .label) before
# checking it against this value_map.
vendor: toluna
dimensions:
  gender:
    source_column: "1"
    value_map:
      "Female": "female"
      "Male": "male"

  age_band:
    source_column: "2"
    value_map:
      "18-24 years old": "18_24"
      "25-34 years old": "25_34"
      "35-44 years old": "35_44"
      "45-54 years old": "45_54"
      "55 years old and above": "55_plus"
    not_collected:
      # Verified by direct extraction: column 2 ("How old are you?") of
      # toluna_survey_misinformation_data.xlsx has exactly 5 distinct values
      # across all 1000 rows, none of them a "Below 18" band. The top band
      # is one combined "55 years old and above" value (214 respondents)
      # with no finer breakdown, so 55-64 and 65+ cannot be separated
      # without inventing a boundary the data doesn't contain. It maps to
      # the canonical combined band 55_plus (v4 feedback F6), so those
      # respondents get their own column rather than being dropped.
      # `reason` is shown to analysts in the Run summary: keep it short and
      # plain (v4 feedback F5).
      "under_18":
        reason: >-
          The age question in this file has no under-18 answer.
      "55_64":
        reason: >-
          This file's oldest age answer is one combined "55 years old and
          above" group, shown as the 55 and above band, so 55-64 and 65+
          can't be separated.
      "65_plus":
        reason: >-
          This file's oldest age answer is one combined "55 years old and
          above" group, shown as the 55 and above band, so 55-64 and 65+
          can't be separated.

  ethnicity:
    source_column: "3"
    value_map:
      "Chinese": "chinese"
      "Indian": "indian"
      "Others": "other"
      "Malay": "malay"

  income:
    source_column: "4"
    value_map:
      "8,000 to 10,999 SGD": "8000_10999"
      "17,000 SGD and above": "17000_plus"
      "11,000 to 13,999 SGD": "11000_13999"
      "14,000 to 16,999 SGD": "14000_16999"
      "2,000 to 4,999 SGD": "2000_4999"
      "5,000 to 7,999 SGD": "5000_7999"
      "Less than 2,000 SGD": "under_2000"

  education:
    source_column: "5"
    value_map:
      "Diploma": "diploma"
      "Secondary and below": "secondary_and_below"
      "Postgraduate": "postgraduate"
      "Degree": "degree"
      "Post-Secondary (ITE/JC)": "post_secondary"
      "Others": "other"
