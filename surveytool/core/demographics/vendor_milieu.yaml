# Milieu vendor mapping.
#
# Verified against surveytool/ingest/milieu.py and the real fixture
# milieu_survey_coe_data.csv: demographic questions are qids q5-q8 (parsed
# from the "[qid]: qtype - text" CSV header convention). q5/q6/q7 are
# single-select; q8 is multi-select with the "; " delimiter, which is
# surveytool.ingest.milieu._MULTI_DELIMITER — the multi_select prototype case
# named in the build plan.
#
# Milieu has no age question anywhere in its column list (checked the full
# parsed question set: q5, q6, q7, q8, q10-q14 are the only questions) so
# age_band is intentionally absent from this mapping — not a gap, just not
# collected by this vendor.
#
# IMPORTANT: unlike Rakuten, Milieu has no fixed vendor codebook — the
# ingest adapter (surveytool/ingest/milieu.py::_collect_single_values /
# _collect_multi_values) assigns numeric codes purely by first-appearance
# order of each label within the loaded rows. Those numbers are an artifact
# of THIS fixture file's row order, not stable vendor codes: a re-export
# with a different first respondent (or reordered rows) would assign
# different numbers to the same labels. So value_map here keys on the
# normalized label text itself (via normalize_label(), see
# surveytool/core/hygiene.py) rather than the derived numeric code — the
# label text is what's actually stable across re-ingests of different files.
# demographic_registry.py's _raw_values_for_column() resolves each
# response's numeric raw_value back to its label (via the Question's
# ScaleCode.code -> .label) before checking it against this value_map.
vendor: milieu
dimensions:
  gender:
    source_column: "q5"
    value_map:
      "Male": "male"
      "Female": "female"

  ethnicity:
    # Milieu's codebook has 5 codes (Others/Chinese/Malay/Indian/Caucasian),
    # one more granular than the canonical ethnicity set (which matches
    # Rakuten's and Toluna's 4-category codebooks: Chinese/Malay/Indian/
    # Other). Caucasian has no canonical home of its own — both Rakuten and
    # Toluna would fail reachability for a "caucasian" category — so it maps
    # to "other" alongside Milieu's own "Others" code, consistent with how
    # Rakuten/Toluna already use their "Others" code as the catch-all for
    # any ethnicity outside Chinese/Malay/Indian.
    source_column: "q6"
    value_map:
      "Others": "other"
      "Chinese": "chinese"
      "Malay": "malay"
      "Indian": "indian"
      "Caucasian": "other"

  car_ownership:
    source_column: "q7"
    value_map:
      "Yes, I use car rental or car-sharing services": "rents_or_shares_service"
      "No, I do not drive or have access to a car": "none"
      "Yes, I share a car with others (e.g. family, friends)": "shares"
      "Yes, I own a car": "owns"

  car_ownership_reasons:
    source_column: "q8"
    multi_select: true
    value_map:
      "I do not have a driving licence": "no_licence"
      "Other": "other"
      "I prefer other modes of transport (e.g. cycling, ride-hailing)": "prefers_other_modes"
      "General cost of car ownership is too high (e.g. maintenance, fuel, insurance)": "cost_too_high"
      "Sufficient public transport options": "sufficient_public_transport"
      "Environmental or sustainability concerns": "environmental_concerns"
      "Certificate of Entitlement (COE) prices are too high": "coe_too_high"
