families:
  agreement:
    variants:
      default:
        points:
          - patterns: ["strongly disagree", "disagree"]
          - patterns: ["neutral", "neither agree nor disagree", "neither"]
          - patterns: ["strongly agree", "agree"]

  satisfaction:
    variants:
      default:
        points:
          - patterns: ["very dissatisfied", "strongly dissatisfied", "dissatisfied"]
          - patterns: ["neither satisfied nor dissatisfied", "neutral", "neither"]
          - patterns: ["very satisfied", "strongly satisfied", "satisfied"]

  likelihood:
    variants:
      default:
        points:
          - patterns: ["very unlikely", "unlikely"]
          - patterns: ["neutral", "neither likely nor unlikely", "neither"]
          - patterns: ["very likely", "likely"]

  importance:
    variants:
      default:
        points:
          - patterns:
              - "slightly important"
              - "very unimportant"
              - "unimportant"
              - "not important"
              - "not very important"
              - "not at all important"
              - "not important at all"
          - patterns:
              - "moderately important"
              - "somewhat important"
              - "neutral"
              - "neither important nor unimportant"
              - "neither"
          - patterns:
              - "extremely important"
              - "very important"
              - "important"

  effectiveness:
    variants:
      default:
        points:
          - patterns: ["very ineffective", "ineffective", "not effective", "not at all effective"]
          - patterns: ["neutral", "neither effective nor ineffective", "neither"]
          - patterns: ["very effective", "effective"]

  ability:
    variants:
      default:
        points:
          - patterns:
              - "extremely unable to"
              - "very unable"
              - "somewhat unable to"
              - "unable"
              - "not able"
              - "not capable"
              - "not at all able"
          - patterns: ["neutral", "neither able nor unable", "neither"]
          - patterns:
              - "extremely able to"
              - "very able"
              - "somewhat able to"
              - "able"
              - "very capable"
              - "capable"

  frequency:
    variants:
      default:
        points:
          - patterns: ["rarely", "never", "very rarely"]
          - patterns: ["sometimes", "neutral"]
          - patterns: ["always", "very often", "often"]

  zero_to_ten:
    variants:
      default:
        points:
          - patterns: ["0", "1", "2"]
          - patterns: ["5"]
          - patterns: ["10", "9", "8"]

  calendar_frequency:
    variants:
      default:
        points:
          - patterns: ["rarely", "never"]
          - patterns: ["monthly", "occasionally", "sometimes"]
          - patterns: ["daily", "weekly"]

  intensity:
    variants:
      default:
        points:
          - patterns: ["not at all", "none", "not really"]
          - patterns: ["somewhat", "a little", "moderately"]
          - patterns: ["a lot", "a great deal"]

  concern:
    variants:
      default:
        points:
          - patterns: ["not very concerned", "not concerned at all", "not at all concerned"]
          - patterns: ["somewhat concerned", "moderately concerned"]
          - patterns: ["very concerned", "extremely concerned"]

  worry:
    variants:
      default:
        points:
          - patterns: ["not very worried", "not worried at all", "not at all worried"]
          - patterns: ["somewhat worried"]
          - patterns: ["very worried", "extremely worried"]

  # PureSpectrum's Q4 (relevance) codebook pairs the scale's midpoint with a
  # don't-know option in a single label: "Neutral/don't know enough to say"
  # (fold_label collapses the curly apostrophe and casefolds it to
  # "neutral/don't know enough to say", confirmed directly against the
  # fixture — this does NOT equal the bare "neutral" pattern, so it needs
  # its own entry). Deliberate call: treat it as the neutral role, not as
  # non-substantive/excluded. The respondent actively selected point 3 of 5
  # on an ordered 1-5 scale — it is a self-chosen midpoint, not a refusal or
  # a "prefer not to answer" — so it belongs in the ordered scale and
  # participates in netting like any other neutral response, rather than
  # being dropped from the base as a non-answer.
  relevance:
    variants:
      default:
        points:
          - patterns:
              - "not very relevant"
              - "not relevant at all"
              - "not at all relevant"
              - "irrelevant"
          - patterns:
              - "neutral"
              - "neutral/don't know enough to say"
              - "moderately relevant"
          - patterns: ["extremely relevant", "very relevant", "relevant"]

  # PureSpectrum's D5 (fluency) labels carry a descriptive suffix after a
  # dash, e.g. "Basic — a few words or phrases" (fold_label folds the em
  # dash to ASCII "-" but does not strip the trailing text, confirmed
  # directly against the fixture: it folds to
  # "basic - a few words or phrases", not "basic"). Matching here is exact
  # set membership, not substring or prefix matching, so the patterns below
  # will NOT match D5's actual labels as they appear in this fixture. Added
  # anyway per the brief's exact specification, in case a future vendor
  # file uses these bare labels without the descriptive suffix. Deliberately
  # not adding fuzzy prefix or dash-stripping logic to force a match on
  # D5 — that is out of scope for this task (left for the resolver) and
  # would risk over-matching elsewhere.
  fluency:
    variants:
      default:
        points:
          - patterns: ["none", "not at all"]
          - patterns: ["basic"]
          - patterns: ["fluent", "conversational"]
