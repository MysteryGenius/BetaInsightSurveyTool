[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surveytool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "hypothesis>=6.0"]

[project.scripts]
surveytool = "surveytool.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["surveytool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
